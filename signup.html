<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Get Started | Digital Boost</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">

    <div class="logo">
        <img src="logo.png" alt="Digital Boost Logo">
        <span>Digital Boost</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="services.html">Services</a>
        <a href="signup.html" class="signup-btn">Get Started</a>
    </nav>

</header>


<section class="signup-section">

    <div class="signup-container">

        <div class="signup-heading">

            <p>GET STARTED</p>

            <h1>Let's Grow Your Business</h1>

            <span>
                Fill out the form and our team will contact you.
            </span>

        </div>


        <!-- WORKING FORMSPREE FORM -->

        <form
            action="https://formspree.io/f/xgawojwd"
            method="POST"
        >

            <div class="form-grid">


                <div class="form-group">

                    <label>Full Name *</label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>WhatsApp Number *</label>

                    <input
                        type="tel"
                        name="phone"
                        placeholder="+92 300 1234567"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Email Address *</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="your@email.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Business Name</label>

                    <input
                        type="text"
                        name="business"
                        placeholder="Your business name"
                    >

                </div>


                <div class="form-group">

                    <label>Select Service *</label>

                    <select name="service" required>

                        <option value="">
                            Select a service
                        </option>

                        <option value="Social Media Marketing">
                            Social Media Marketing
                        </option>

                        <option value="Meta Ads">
                            Meta Ads
                        </option>

                        <option value="Google Ads">
                            Google Ads
                        </option>

                        <option value="SEO">
                            SEO
                        </option>

                        <option value="Graphic Design">
                            Graphic Design
                        </option>

                        <option value="Website Development">
                            Website Development
                        </option>

                        <option value="Content Creation">
                            Content Creation
                        </option>

                        <option value="Lead Generation">
                            Lead Generation
                        </option>

                        <option value="Branding">
                            Branding
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Monthly Budget</label>

                    <select name="budget">

                        <option value="">
                            Select budget
                        </option>

                        <option value="Under Rs. 25,000">
                            Under Rs. 25,000
                        </option>

                        <option value="Rs. 25,000 - 50,000">
                            Rs. 25,000 - 50,000
                        </option>

                        <option value="Rs. 50,000 - 100,000">
                            Rs. 50,000 - 100,000
                        </option>

                        <option value="Rs. 100,000+">
                            Rs. 100,000+
                        </option>

                    </select>

                </div>


                <div class="form-group full">

                    <label>Tell Us About Your Business *</label>

                    <textarea
                        name="message"
                        placeholder="Tell us about your business and your goals..."
                        required
                    ></textarea>

                </div>

            </div>


            <button
                type="submit"
                class="submit-btn"
            >
                Submit Request
            </button>


            <p class="form-note">
                Your information is secure and private.
            </p>

        </form>

    </div>

</section>


<a
    href="https://wa.me/923000000000"
    class="whatsapp-floating"
    target="_blank"
>
    WhatsApp
</a>


<footer>

    <h3>Digital Boost Marketing Agency</h3>

    <p>
        © 2026 Digital Boost. All Rights Reserved.
    </p>

</footer>

</body>
</html>
